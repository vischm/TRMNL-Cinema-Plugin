---
id: 511825
name: Cinema
description: Top-rated films in your cinemas
recipe_overview: |-
  Cinema shows the three best films currently playing in the cinemas of your city, together with the showtimes
  that are still to come today. The programme comes from cinema.de and covers hundreds of German towns and cities,
  from Berlin, Hamburg and München to small towns with a single cinema. Every film is looked up on Letterboxd and
  ranked by its average rating, so the screen always suggests what is worth watching tonight. Showtimes that have
  already started disappear, and after the last screening of the day the plugin switches to tomorrow's programme.
  Version tags such as OmU, OV, 3D or 70mm are shown next to each showtime. Enter your Letterboxd username to hide
  films you have logged in your diary recently, and limit the list to your favourite cinemas if you live in a big
  city. The plugin refreshes hourly and comes with full, half and quadrant layouts in landscape and portrait.
strategy: polling
polling_verb: get
polling_url: ''
polling_headers: ''
static_data: ''
no_screen_padding: 'no'
dark_mode: 'no'
framework_version: '3.4.0'
refresh_interval: 60
serverless_language: python
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: Shows the highest-rated movies currently screening in your city's cinemas, ranked by their Letterboxd rating.
  github_url: https://github.com/vischm/TRMNL-Cinema-Plugin
- keyname: city
  field_type: string
  name: City
  description: Your city as cinema.de names it, e.g. Leipzig, München or Frankfurt am Main. If it isn't found, paste the cinema.de programme URL of your city instead.
  placeholder: Berlin
  default: Berlin
- keyname: letterboxd_username
  field_type: string
  name: Letterboxd Username
  description: Optional. Films you logged on Letterboxd recently are hidden.
  optional: true
- keyname: recent_days
  field_type: number
  name: Hide Films Watched Within (Days)
  description: How far back your Letterboxd diary counts as recently watched.
  default: 180
  min: 1
  max: 3650
  optional: true
- keyname: preferred_cinemas
  field_type: multi_string
  name: Preferred Cinemas
  description: Optional. These cinemas are listed first under each film, in this order. Part of the name is enough, e.g. Schauburg.
  placeholder: Schauburg
  optional: true
- keyname: excluded_cinemas
  field_type: multi_string
  name: Excluded Cinemas
  description: Optional. Screenings at these cinemas are hidden. Part of the name is enough, e.g. Sommerkino.
  placeholder: Sommerkino
  optional: true
