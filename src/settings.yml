---
id: 511825
name: Cinema
description: Top-rated films in German cinemas
recipe_overview: >-
  Cinema shows the best-rated films currently playing in the cinemas of your German city, three on TRMNL OG and
  four on TRMNL X, together with the showtimes that are still to come today. It works in Germany only: the
  programme comes from cinema.de, which covers hundreds of German towns and cities, from Berlin, Hamburg and
  München to small towns with a single cinema. Every film is looked up on Letterboxd and ranked by its average
  rating, so the screen always suggests what is worth watching tonight. Showtimes that have already started
  disappear, and after the last screening of the day the plugin switches to tomorrow's programme. Version tags
  such as OmU, OV, 3D or 70mm are shown next to each showtime. Enter your Letterboxd username to hide films you
  have logged in your diary recently, list your favourite cinemas first and hide the ones you never go to. The
  plugin refreshes hourly and comes with full, half and quadrant layouts in landscape and portrait.
strategy: polling
polling_verb: get
polling_url: ''
polling_headers: ''
static_data: ''
no_screen_padding: 'no'
dark_mode: 'no'
framework_version: '3.4.0'
refresh_interval: 60
serverless_language: python
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: Shows the highest-rated movies currently screening in your city's cinemas in Germany, ranked by their Letterboxd rating.
  github_url: https://github.com/vischm/TRMNL-Cinema-Plugin
- keyname: city
  field_type: string
  name: City
  description: Your city in Germany as cinema.de names it, e.g. Leipzig, München or Frankfurt am Main. If it isn't found, paste the cinema.de programme URL of your city instead.
  placeholder: Berlin
  default: Berlin
- keyname: preferred_cinemas
  field_type: multi_string
  name: Preferred Cinemas
  description: Listed first under each film, in this order. Part of the name is enough, e.g. Schauburg.
  placeholder: Schauburg
  optional: true
  group: Cinemas
- keyname: excluded_cinemas
  field_type: multi_string
  name: Excluded Cinemas
  description: Screenings at these cinemas are hidden. Part of the name is enough, e.g. Sommerkino.
  placeholder: Sommerkino
  optional: true
  group: Cinemas
- keyname: hide_watched
  field_type: boolean
  name: Hide Films I've Watched
  description: Hides films you logged in your Letterboxd diary.
  default: false
  optional: true
  group: Letterboxd
  conditional_validation:
  - when: "true"
    visible:
    - letterboxd_username
    - recent_days
    required:
    - letterboxd_username
- keyname: letterboxd_username
  field_type: string
  name: Letterboxd Username
  description: Your username or profile URL, e.g. letterboxd.com/yourname.
  placeholder: yourname
  optional: true
  group: Letterboxd
- keyname: recent_days
  field_type: select
  name: Remember Watched Films For
  description: How long a film you watched stays hidden. Letterboxd's feed covers your last 50 diary entries.
  options:
  - "1 month": 30
  - "3 months": 90
  - "6 months": 180
  - "1 year": 365
  default: 180
  optional: true
  group: Letterboxd
