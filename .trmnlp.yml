# Local preview config for `bin/trmnlp serve` / `build` / `lint` (not uploaded to TRMNL)
# {{ env.VARIABLE }} interpolation is available here
---
watch:
  - .trmnlp.yml
  - src

time_zone: Europe/Berlin

# values of custom fields (defined in src/settings.yml)
custom_fields:
  city: Leipzig
  letterboxd_username: "{{ env.LETTERBOXD_USERNAME }}"
  recent_days: 180
  preferred_cinemas: ""
  excluded_cinemas: ""
