# Local preview config for `bin/trmnlp serve` / `build` / `lint` (not uploaded to TRMNL)
# {{ env.VARIABLE }} interpolation is available here
---
watch:
  - .trmnlp.yml
  - src

time_zone: Europe/Berlin

# values of custom fields (defined in src/settings.yml)
custom_fields:
  city: Leipzig
  letterboxd_username: "{{ env.LETTERBOXD_USERNAME }}"
  recent_days: 180
  cinemas: ""

# Temporary until the layouts are redesigned: half/quadrant views don't exist yet and
# full.liquid still nests a layout (it renders fine on framework 3.4.0)
ignored_lint_rules:
  - layouts_have_content
  - no_nested_layouts
