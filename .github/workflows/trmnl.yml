name: Deploy plugin to TRMNL

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.trmnlp.yml'
      - '.github/workflows/trmnl.yml'
  workflow_dispatch:

env:
  # Pinned so runs are repeatable; bump deliberately
  TRMNLP_IMAGE: trmnl/trmnlp:v0.31.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trmnlp lint
        run: docker run --rm -v "$PWD":/plugin "$TRMNLP_IMAGE" lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'  # the version TRMNL's serverless runtime uses
      - run: pip install requests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trmnlp test (every view on every TRMNL device)
        shell: bash
        run: docker run --rm -e CI=true -v "$PWD":/plugin "$TRMNLP_IMAGE" test --report report 2>&1 | tee trmnlp-test.log
      - if: always()
        name: Annotate failures and transform durations
        shell: bash
        run: |
          python3 - <<'EOF'
          import json
          try:
              examples = json.load(open("report/report.json"))["examples"]
          except Exception as error:
              log = open("trmnlp-test.log", errors="replace").read()[-3000:]
              print("::error title=trmnlp test crashed (%s)::%s" % (error, log.replace("%", "%25").replace("\n", "%0A")))
              raise SystemExit
          for example in examples:
              if example["status"] == "failed":
                  message = (example.get("message") or "").replace("%", "%25").replace("\n", "%0A")[:2000]
                  print("::error title=%s::%s" % (example["description"][:150], message))
          runs = sorted(((run["duration_ms"], example["description"], run.get("requests") or [])
                         for example in examples for run in example.get("runs") or [] if run.get("duration_ms")),
                        key=lambda r: r[0])
          if runs:
              slowest = "%0A".join("%d ms, %d requests (%d aborted): %s" % (ms, len(requests),
                                   sum(1 for r in requests if r.get("aborted")), description[-80:])
                                   for ms, description, requests in runs[-5:])
              print("::notice title=Transform durations::%d runs, median %d ms, max %d ms (TRMNL's limit is 5000 ms)%%0A%s"
                    % (len(runs), runs[len(runs) // 2][0], runs[-1][0], slowest))
          EOF
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trmnlp-report
          path: report

  push:
    needs: [lint, test, render]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trmnlp push
        run: docker run --rm -e TRMNL_API_KEY -v "$PWD":/plugin "$TRMNLP_IMAGE" push --force
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
