name: Deploy plugin to TRMNL

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.trmnlp.yml'
      - '.github/workflows/trmnl.yml'
  workflow_dispatch:

env:
  # Pinned so runs are repeatable; bump deliberately
  TRMNLP_IMAGE: trmnl/trmnlp:v0.31.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trmnlp lint
        run: docker run --rm -v "$PWD":/plugin "$TRMNLP_IMAGE" lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'  # the version TRMNL's serverless runtime uses
      - run: pip install requests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trmnlp test (every view on every TRMNL device)
        run: docker run --rm -e CI=true -v "$PWD":/plugin "$TRMNLP_IMAGE" test --report report
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trmnlp-report
          path: report

  push:
    needs: [lint, test, render]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trmnlp push
        run: docker run --rm -e TRMNL_API_KEY -v "$PWD":/plugin "$TRMNLP_IMAGE" push --force
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
